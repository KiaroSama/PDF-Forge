name: CI

# Run the test suite and the quality gates on every push and pull request to
# main, and on demand.
on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'refactor/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege: these jobs only need to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 is deliberately absent: pymupdf (the single PDF engine, and the
        # newest release 1.28.0 is the latest published) ships no
        # `cp314-cp314` wheel for any platform - only a free-threaded
        # `pymupdf-1.28.0-cp314-cp314t-manylinux_2_28_x86_64.whl`. Both a 3.14
        # leg and a 3.14 user would fall back to building MuPDF from the
        # sdist. Add '3.14' here as soon as a `cp314-cp314` pymupdf wheel
        # exists for manylinux and win_amd64.
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # Coverage is produced by this leg instead of by a separate job that
        # re-ran the entire suite on the same os/interpreter. The threshold
        # (`fail_under` in pyproject.toml [tool.coverage.report]) is enforced
        # by pytest-cov, so a drop below it fails this leg like any other test
        # failure.
        include:
          - os: ubuntu-latest
            python-version: '3.12'
            coverage: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        run: python -m pytest -q

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        # The XML is written outside the checkout so the cleanliness check
        # below still sees an unmodified tree.
        run: >-
          python -m pytest --cov --cov-report=term-missing
          --cov-report=xml:${{ runner.temp }}/coverage.xml

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: warn

      - name: Repository must be clean after the suite
        shell: bash
        run: |
          # A test that writes into the checkout would show up here.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The test suite modified the checkout:"
            git status --porcelain
            exit 1
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check pdf_forge tests
      - name: Mypy
        run: python -m mypy

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # secret scanning needs history
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Dependency vulnerability audit
        run: python -m pip_audit --strict --progress-spinner off
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  powershell:
    name: PowerShell analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($results.Count) error(s)."
          }
          Write-Host 'PSScriptAnalyzer: no errors.'

  cli-smoke:
    name: CLI entry points (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      # The non-interactive entry points are the ones a user reaches before any
      # menu, so a failure here is a failure to start at all. They are checked
      # on both platforms because the Windows console path differs.
      - name: Version
        run: python -m pdf_forge --version
      - name: Version agrees with the package constant
        shell: python
        run: |
          import os, subprocess, sys
          # `shell: python` runs a script from a temp file, so sys.path[0] is
          # that temp directory - the checkout is the working directory but is
          # not importable without this.
          sys.path.insert(0, os.getcwd())
          import pdf_forge
          out = subprocess.run([sys.executable, "-m", "pdf_forge", "--version"],
                               capture_output=True, text=True, check=True).stdout
          assert pdf_forge.APP_VERSION in out, (pdf_forge.APP_VERSION, out)
          print("version reported:", pdf_forge.APP_VERSION)
      - name: Diagnose
        run: python -m pdf_forge --diagnose
